# Esteira DevSecOps 
# 8 etapas sequenciais + Resumo da Esteira. Cada etapa publica seu relatório
# como artifact (relatorio-0N-<ferramenta>) com if: always().
#
# Actions fixadas pelo SHA do commit (tag correspondente no comentário) para
# mitigar ataques à cadeia de suprimentos.

name: DevSecOps Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissão mínima por padrão; permissões extras somente nos jobs que precisam.
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'
  GITLEAKS_VERSION: '8.30.1'
  SEMGREP_VERSION: '1.183.0'
  TRIVY_VERSION: 'v0.76.1'

jobs:

  # ───────────────────────────── Etapa 1 ─────────────────────────────
  secrets-scan:
    name: "1 - Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (versão fixa + checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks – varredura do histórico completo
        run: |
          gitleaks git . \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks.json

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-01-gitleaks
          path: gitleaks.json
          if-no-files-found: warn

  # ───────────────────────────── Etapa 2 ─────────────────────────────
  sast:
    name: "2 - SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    permissions:
      contents: read
      security-events: write   # envio do SARIF para a aba Security (bônus)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Semgrep (versão fixa)
        run: pip install "semgrep==${SEMGREP_VERSION}"

      # --exclude-rule: a regra django-no-csrf-token procura a tag {% csrf_token %}
      # do Django; a aplicação é Flask e usa token CSRF próprio (campo csrf_token).
      # Falso positivo justificado em docs/observacoes.md.
      - name: Semgrep (p/default + p/owasp-top-ten + p/python)
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/python \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token \
            --metrics=off \
            --error \
            --json-output=semgrep.json \
            --sarif-output=semgrep.sarif \
            .

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-02-semgrep
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: warn

      - name: Enviar SARIF para GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ───────────────────────────── Etapa 3 ─────────────────────────────
  build:
    name: "3 - Build, dependências e artefato"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Equivalente ao "npm ci": versões exatas + verificação de hash (lock)
      - name: Instalar dependências (determinístico)
        run: pip install --require-hashes -r src/requirements.txt

      - name: Ferramentas de inventário/auditoria
        run: pip install pipdeptree==4.2.13 pip-audit==2.10.1

      - name: Árvore de dependências
        run: |
          {
            echo "# Árvore de dependências de runtime (commit ${GITHUB_SHA})"
            pipdeptree --packages flask,werkzeug,gunicorn
            echo
            echo "# pip freeze (requirements.txt)"
            grep -E '^[a-z0-9]' src/requirements.txt | sed 's/ \\$//'
          } > arvore-dependencias.txt
          cat arvore-dependencias.txt

      # Equivalente ao "npm audit --json". Informativo: o bloqueio de
      # dependências vulneráveis acontece na etapa 4 (Trivy).
      - name: Auditoria nativa (pip-audit – informativo)
        run: |
          pip-audit -r src/requirements.txt --require-hashes --format json --output pip-audit.json \
            || echo "::warning::pip-audit encontrou vulnerabilidades (informativo; gate na etapa 4)"

      - name: Instalar dependências de teste
        run: pip install -r src/requirements-dev.txt

      - name: Testes automatizados + cobertura
        run: |
          pytest tests/ -v \
            --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml \
            --junitxml=pytest-junit.xml

      - name: Empacotar artefato (nomeado com o SHA)
        run: tar -czf "security-alert-${GITHUB_SHA}.tar.gz" -C src .

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-03-build
          path: |
            arvore-dependencias.txt
            pip-audit.json
            pytest-junit.xml
            coverage.xml
          if-no-files-found: warn

      - name: Publicar artefato da aplicação
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artefato-aplicacao-${{ github.sha }}
          path: security-alert-${{ github.sha }}.tar.gz

  # ───────────────────────────── Etapa 4 ─────────────────────────────
  sca:
    name: "4 - SCA (Trivy fs)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy fs – relatório completo (tabela)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          output: trivy-fs.txt
          exit-code: '0'

      - name: Trivy fs – quality gate HIGH/CRITICAL (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: '1'

      - name: Exibir relatório
        if: always()
        run: cat trivy-fs.txt || true

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-04-trivy-sca
          path: |
            trivy-fs.txt
            trivy-fs.json
          if-no-files-found: warn

  # ───────────────────────────── Etapa 5 ─────────────────────────────
  docker-build:
    name: "5 - Docker build + push (GHCR)"
    runs-on: ubuntu-latest
    needs: sca
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write    # push no GHCR – somente neste job
      id-token: write    # assinatura keyless com Cosign (bônus)
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nome da imagem em minúsculas
        id: vars
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR (GITHUB_TOKEN)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ github.sha }}

      # Tag = SHA do commit (imutável). A tag "latest" NÃO é publicada.
      - name: Build e push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Instalar Cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Assinar imagem (Cosign keyless – bônus)
        id: sign
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Gerar SBOM SPDX (bônus)
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Relatório do build (imagem, digest e manifesto)
        if: always()
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "# Relatório – Docker build + push (GHCR)"
            echo
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Imagem (tag = SHA) | \`${TAG}\` |"
            echo "| Digest | \`${DIGEST:-n/d}\` |"
            echo "| Referência imutável | \`${IMAGE}@${DIGEST:-n/d}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Assinatura Cosign | ${SIGN_OUTCOME:-n/d} |"
            echo "| Execução | ${RUN_URL} |"
            echo
            echo "## Manifesto"
            echo '```json'
            if [ -n "${DIGEST}" ]; then
              docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" || echo "{}"
            else
              echo "{}"
            fi
            echo
            echo '```'
          } > docker-build.md
          cat docker-build.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-05-docker-build
          path: |
            docker-build.md
            sbom.spdx.json
          if-no-files-found: warn

  # ───────────────────────────── Etapa 6 ─────────────────────────────
  image-scan:
    name: "6 - Scan da imagem (Trivy image)"
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      packages: read
    env:
      # Credenciais do registry via variável de ambiente (nunca na linha de comando)
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Trivy image – relatório completo (tabela)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ needs.docker-build.outputs.image-ref }}
          scanners: vuln,secret
          format: table
          output: trivy-image.txt
          exit-code: '0'

      - name: Trivy image – quality gate HIGH/CRITICAL com correção (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ needs.docker-build.outputs.image-ref }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: '1'

      - name: Exibir relatório
        if: always()
        run: cat trivy-image.txt || true

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-06-trivy-image
          path: |
            trivy-image.txt
            trivy-image.json
          if-no-files-found: warn

  # ───────────────────────────── Etapa 7 ─────────────────────────────
  dast-staging:
    name: "7 - Homologação + DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [docker-build, image-scan]
    environment:
      name: homologacao
      url: http://localhost:5000
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login no GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deploy de homologação no próprio runner, com a MESMA imagem (digest)
      # aprovada nas etapas 5 e 6.
      - name: Subir homologação
        env:
          IMAGE_REF: ${{ needs.docker-build.outputs.image-ref }}
          STAGING_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          set -euo pipefail
          key="${STAGING_SECRET_KEY:-$(openssl rand -hex 32)}"
          echo "::add-mask::${key}"
          docker run -d --name security-alert-homolog \
            -e SECRET_KEY="${key}" \
            -p 5000:5000 \
            "${IMAGE_REF}"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:5000/login; then
              echo "Homologação no ar após ${i} tentativa(s)"; exit 0
            fi
            sleep 2
          done
          docker logs security-alert-homolog
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:5000
          cmd_options: '-a'
          fail_action: false          # informativo nesta atividade
          allow_issue_writing: false
          artifact_name: relatorio-07-homologacao-zap

      - name: Logs da homologação
        if: always()
        run: docker logs security-alert-homolog > homologacao-container.log 2>&1 || true

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homologacao-logs
          path: homologacao-container.log
          if-no-files-found: warn

  # ───────────────────────────── Etapa 8 ─────────────────────────────
  # O environment "producao" deve ter Required reviewers: o job fica em espera
  # até a aprovação; a rejeição interrompe o deploy.
  deploy-prod:
    name: "8 - Aprovação + Produção"
    runs-on: ubuntu-latest
    needs: [docker-build, dast-staging]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: producao
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      # Deploy real no Render usando a imagem pelo digest (SHA). O Deploy Hook
      # é um Environment secret do environment "producao".
      - name: Deploy em produção (Render – imagem pelo digest)
        id: deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.docker-build.outputs.image-ref }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RENDER_DEPLOY_HOOK_URL não configurado no environment 'producao': deploy NÃO executado."
            exit 0
          fi
          encoded=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["IMAGE_REF"], safe=""))')
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${encoded}" -o render-response.json
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Verificar produção (smoke test)
        if: steps.deploy.outputs.deployed == 'true' && vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "${PRODUCTION_URL%/}/login"; then echo "Produção respondendo"; exit 0; fi
            sleep 20
          done
          echo "::error::Produção não respondeu em ${PRODUCTION_URL}"; exit 1

      - name: Relatório de produção
        if: always()
        env:
          IMAGE_REF: ${{ needs.docker-build.outputs.image-ref }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "# Relatório – Aprovação + Produção"
            echo
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Imagem (digest) | \`${IMAGE_REF}\` |"
            echo "| Responsável (disparo) | ${GITHUB_ACTOR} |"
            echo "| Data/hora (UTC) | $(date -u +'%Y-%m-%dT%H:%M:%SZ') |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Deploy executado | ${DEPLOYED:-false} |"
            echo "| URL de produção | ${PRODUCTION_URL:-não configurada} |"
            echo "| Execução | ${RUN_URL} |"
            echo
            echo "A aprovação (quem aprovou e quando) fica registrada na execução,"
            echo "em *Deployments / Review deployments* do environment \`producao\`."
          } > deploy-producao.md
          cat deploy-producao.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-08-producao
          path: deploy-producao.md

  # ───────────────────────── Resumo da Esteira ─────────────────────────
  pipeline-summary:
    name: "Resumo da Esteira"
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, build, sca, docker-build, image-scan, dast-staging, deploy-prod]
    if: always()
    steps:
      - name: Baixar relatórios
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: relatorio-*
          path: reports

      - name: Consolidar achados (jq)
        env:
          R1: ${{ needs.secrets-scan.result }}
          R2: ${{ needs.sast.result }}
          R3: ${{ needs.build.result }}
          R4: ${{ needs.sca.result }}
          R5: ${{ needs.docker-build.result }}
          R6: ${{ needs.image-scan.result }}
          R7: ${{ needs.dast-staging.result }}
          R8: ${{ needs.deploy-prod.result }}
          DEPLOYED: ${{ needs.deploy-prod.outputs.deployed }}
        run: |
          set -uo pipefail
          count() { # count <arquivo> <filtro jq> <texto se ausente>
            if [ -f "$1" ]; then jq -r "$2" "$1" 2>/dev/null || echo "erro ao ler"; else echo "$3"; fi
          }
          d=reports
          a1="$(count $d/relatorio-01-gitleaks/gitleaks.json 'length' 'sem relatório') segredos"
          a2="$(count $d/relatorio-02-semgrep/semgrep.json '.results | length' 'sem relatório') achados"
          a3="$(count $d/relatorio-03-build/pip-audit.json '[.dependencies[]?.vulns[]?] | length' 'sem relatório') vulns (pip-audit)"
          a4="$(count $d/relatorio-04-trivy-sca/trivy-fs.json '[.Results[]? | (.Vulnerabilities // [])[], (.Misconfigurations // [])[], (.Secrets // [])[]] | length' 'sem relatório') HIGH/CRITICAL"
          a6="$(count $d/relatorio-06-trivy-image/trivy-image.json '[.Results[]? | (.Vulnerabilities // [])[], (.Secrets // [])[]] | length' 'sem relatório') HIGH/CRITICAL (com correção)"
          zap=$d/relatorio-07-homologacao-zap/report_json.json
          if [ -f "$zap" ]; then
            hi=$(jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' "$zap")
            me=$(jq '[.site[]?.alerts[]? | select(.riskcode=="2")] | length' "$zap")
            a7="${hi} alertas High, ${me} Medium"
          else
            a7="sem relatório"
          fi
          if [ "${DEPLOYED:-}" = "true" ]; then a8="deploy executado"; elif [ "$R8" = "success" ]; then a8="aprovado; deploy NÃO configurado"; else a8="-"; fi
          {
            echo "# Resumo da Esteira DevSecOps"
            echo
            echo "Commit \`${GITHUB_SHA}\` · branch \`${GITHUB_REF_NAME}\` · execução #${GITHUB_RUN_NUMBER}"
            echo
            echo "| # | Etapa | Resultado | Achados |"
            echo "|---|-------|-----------|---------|"
            echo "| 1 | Secrets (Gitleaks) | ${R1} | ${a1} |"
            echo "| 2 | SAST (Semgrep) | ${R2} | ${a2} |"
            echo "| 3 | Build + dependências | ${R3} | ${a3} |"
            echo "| 4 | SCA (Trivy fs) | ${R4} | ${a4} |"
            echo "| 5 | Docker build + GHCR | ${R5} | - |"
            echo "| 6 | Scan da imagem (Trivy) | ${R6} | ${a6} |"
            echo "| 7 | Homologação + ZAP | ${R7} | ${a7} |"
            echo "| 8 | Aprovação + Produção | ${R8} | ${a8} |"
          } > resumo-esteira.md
          cat resumo-esteira.md >> "$GITHUB_STEP_SUMMARY"
          cat resumo-esteira.md

      - name: Publicar resumo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumo-da-esteira
          path: resumo-esteira.md
